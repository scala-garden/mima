name: ci

on:
  pull_request:
  push:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt scalafmtCheckRepo

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { java: 11 }
          - { java: 17, sbt2: -Dmima.sbt2 } # the sbt 2 plugin, which needs Scala 3.8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{matrix.java}}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt ${{matrix.sbt2}} +test +mimaReportBinaryIssues

  scripted:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { java: 11 }
          - { java: 17, sbt2: -Dmima.sbt2 } # the sbt 2 plugin, which needs Scala 3.8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{matrix.java}}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt ${{matrix.sbt2}} +sbtplugin/scripted scriptedOldest

  functional-tests:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # the 3.9 and 3.10 compilers need JDK 17
        include:
          - { scala: "2.12", java: 8 }
          - { scala: "2.13", java: 8 }
          - { scala: "3.3", java: 11 }
          - { scala: "3.9", java: 17 }
          - { scala: "3.10", java: 17 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{matrix.java}}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt ++2.12.x "functional-tests/runMain com.typesafe.tools.mima.lib.UnitTests -${{matrix.scala}}"

  integration-tests:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt ++2.12.x integration-tests/test
